name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle script executable
        run: chmod +x ./gradlew

      - name: Decode custom keystore (if provided in secrets)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Artifacts & Verification Checksums
        id: prepare_artifacts
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/*.apk release-artifacts/
          cd release-artifacts
          sha256sum *.apk > checksums.sha256
          echo "SHA-256 Verification Hashes:"
          cat checksums.sha256
          
          # Generate checksum markdown snippet
          echo "### 🔒 Verification Hashes (SHA-256)" > hashes.md
          echo "| Artifact | SHA-256 Checksum |" >> hashes.md
          echo "| :--- | :--- |" >> hashes.md
          while IFS= read -r line; do
            HASH=$(echo "$line" | awk '{print $1}')
            FILE=$(echo "$line" | awk '{print $2}')
            echo "| \`$FILE\` | \`$HASH\` |" >> hashes.md
          done < checksums.sha256
          
          echo "HASHES_MD<<EOF" >> $GITHUB_ENV
          cat hashes.md >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.apk
            release-artifacts/checksums.sha256
          generate_release_notes: true
          append_body: true
          body: |
            
            ${{ env.HASHES_MD }}
